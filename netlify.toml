[build]
  publish = "."

# --------------------------------------------------------------------------
# Sicherheits-Header. Die CSP ist streng, weil die Seite nichts von fremden
# Servern laedt - das deckt sich mit der Zusage in der Datenschutzerklaerung.
# form-action 'none', weil es kein Formular gibt.
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# --------------------------------------------------------------------------
# Weiterleitungen der alten Adressen aus material/seiten.txt.
# Jede der 30 gecrawlten Adressen hat hier ein Ziel, damit Suchtreffer und
# Lesezeichen nicht ins Leere laufen.
